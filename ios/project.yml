# Fallback only. If ScreenScout.xcodeproj won't open, run:
#   brew install xcodegen && xcodegen
# from this folder to regenerate it.
name: ScreenScout
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ScreenScout:
    type: application
    platform: iOS
    sources: [ScreenScout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenscout
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screen Scout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
